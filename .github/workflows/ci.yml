name: CI
on: [push, pull_request]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev
        shell: bash

      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.621
          cache: true

      - name: Verify CLT layout
        run: |
          echo "DEVECO_CLI_CLT_PATH=$HOME/ohos-sdk/command-line-tools" >> "$GITHUB_ENV"
          test -f "$HOME/ohos-sdk/command-line-tools/version.txt"
          test -f "$HOME/ohos-sdk/command-line-tools/ohpm/bin/pm-cli.js"
          test -f "$HOME/ohos-sdk/command-line-tools/hvigor/bin/hvigorw.js"

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@26
          cache: true

      - run: corepack enable
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26
          cache: true

      - name: Install npm dependencies
        run: vp install

      - run: mv build-profile.json5_example build-profile.json5

      - name: Install ohpm dependencies
        run: ohpm install

      - name: Build
        run: vpx devecocli build --modules entry entry_wear
